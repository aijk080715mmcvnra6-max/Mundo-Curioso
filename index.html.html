<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<body>

    <div class="right-side">

        <h1 class="main-title">
            ¡BIENVENIDO(A)!
        </h1>

        <img src="imagenes/panda.png" alt="Panda" class="panda-img">

        <form class="login-form" action="login2.php" method="POST">

            <div class="form-group">

                <input
                    type="text"
                    id="usuario"
                    name="usuario"
                    placeholder="Usuario"
                    required>

            </div>

            <div class="form-group">

                <input
                    type="password"
                    id="contrasena"
                    name="password"
                    placeholder="Contraseña 🔑"

            <div class="button-group">

                <button
                    type="submit"
                    name="login"
                    class="btn-primary">

                </button>

                <button
                    type="button"
                    class="btn-secondary"
                    onclick="window.location.href='crearcuenta.html'">
